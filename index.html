<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Tube</title>
    <script type="module">
        import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.2.0/+esm';
        const discordSdk = new DiscordSDK('1474456168045740284');
        discordSdk.ready();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px; background: #202020; display: flex; gap: 8px; position: sticky; top: 0; z-index: 10; }
        input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #303030; background: #121212; color: #fff; outline: none; }
        button { padding: 8px 18px; border-radius: 20px; border: none; background: #cc0000; color: #fff; font-weight: bold; cursor: pointer; }
        #player-container { width: 100%; aspect-ratio: 16/9; background: #000; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        #feed { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.15s; }
        .card:hover { transform: scale(1.02); }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-author { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <header>
        <input type="text" id="query" placeholder="Search YouTube..." onkeydown="if(event.key==='Enter') searchVideos()">
        <button onclick="searchVideos()">Search</button>
    </header>

    <div id="player-container">
        <iframe id="video-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <main id="feed"></main>

    <script>
        async function searchVideos() {
            const query = document.getElementById('query').value.trim();
            if (!query) return;

            const feed = document.getElementById('feed');
            feed.innerHTML = '<p style="padding: 20px; color: #888;">Searching...</p>';

            try {
                // Free, open YouTube API endpoint via Invidious
                const res = await fetch(`https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
                const items = await res.json();
                
                feed.innerHTML = '';
                items.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playVideo(video.videoId);
                    card.innerHTML = `
                        <img src="https://i.ytimg.com/vi/${video.videoId}/mqdefault.jpg" loading="lazy">
                        <div class="card-info">
                            <div class="card-title">${video.title}</div>
                            <div class="card-author">${video.author}</div>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch (err) {
                feed.innerHTML = '<p style="padding: 20px; color: #f55;">Failed to load results. Try another search.</p>';
            }
        }

        function playVideo(id) {
            const container = document.getElementById('player-container');
            const frame = document.getElementById('video-frame');
            container.style.display = 'block';
            frame.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
