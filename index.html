<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria YouTube</title>
    <script type="module">
        import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.2.0/+esm';
        // Replace with Aria's Application ID
        const discordSdk = new DiscordSDK('1474456168045740284');
        await discordSdk.ready();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 10px 14px; background: #202020; display: flex; gap: 8px; position: sticky; top: 0; z-index: 10; }
        input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #333; background: #121212; color: #fff; outline: none; font-size: 14px; }
        button { padding: 8px 18px; border-radius: 20px; border: none; background: #cc0000; color: #fff; font-weight: bold; cursor: pointer; }
        #player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        #feed { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .card { background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .card-info { padding: 8px 10px; }
        .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-author { font-size: 12px; color: #aaa; }
        .badge { position: absolute; top: 8px; left: 8px; background: #cc0000; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <input type="text" id="query" placeholder="Search videos or live streams..." onkeydown="if(event.key==='Enter') searchVideos()">
        <button onclick="searchVideos()">Search</button>
    </header>

    <div id="player-wrapper">
        <iframe id="video-frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <main id="feed"></main>

    <script>
        async function searchVideos() {
            const query = document.getElementById('query').value.trim();
            if (!query) return;

            const feed = document.getElementById('feed');
            feed.innerHTML = '<p style="padding: 16px; color: #888;">Searching...</p>';

            try {
                // Route through Discord's local proxy to avoid CSP fetch block
                const res = await fetch(`/.proxy/api/api/v1/search?q=${encodeURIComponent(query)}`);
                const items = await res.json();
                
                feed.innerHTML = '';
                if (!items || items.length === 0) {
                    feed.innerHTML = '<p style="padding: 16px; color: #888;">No results found.</p>';
                    return;
                }

                items.forEach(video => {
                    if (video.type !== 'video') return;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playVideo(video.videoId);
                    
                    const isLive = video.liveNow;
                    card.innerHTML = `
                        ${isLive ? '<span class="badge">LIVE</span>' : ''}
                        <img src="https://i.ytimg.com/vi/${video.videoId}/mqdefault.jpg" loading="lazy">
                        <div class="card-info">
                            <div class="card-title">${video.title}</div>
                            <div class="card-author">${video.author}</div>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch (err) {
                feed.innerHTML = '<p style="padding: 16px; color: #f55;">Connection failed. Check proxy mappings.</p>';
            }
        }

        function playVideo(id) {
            const wrapper = document.getElementById('player-wrapper');
            const frame = document.getElementById('video-frame');
            wrapper.style.display = 'block';
            // enablejsapi=1 and rel=0 give clean player controls and live handling
            frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
