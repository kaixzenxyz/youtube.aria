<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria YouTube</title>
    <!-- Import Discord Embedded App SDK via CDN -->
    <script type="module">
        import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.2.0/+esm';
        
        // Replace with Aria's actual Application ID
        const discordSdk = new DiscordSDK('1474456168045740284'); 
        
        async function setup() {
            // This signals to Discord that the app successfully loaded
            await discordSdk.ready(); 
        }
        
        setup();
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1e1e24; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- The YouTube Embed Player -->
    <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</body>
</html>
